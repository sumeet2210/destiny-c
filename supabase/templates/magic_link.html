<!--
  Student login email. Code-only by design — see docs/decisions.md.

  Supabase sends this template for signInWithOtp (lib/auth/actions.ts
  #requestStudentOtp). The stock version ships ConfirmationURL and no Token,
  which is why students used to receive a link and never a code.

  Deliberately omits ConfirmationURL entirely: the app has no route that can
  exchange a magic-link code for a session, and clicking such a link CONSUMES
  the token, so a student who tapped it could no longer use the code either.
  Do not add a link back without also adding that route.

  Variable names above are written bare, WITHOUT the surrounding braces, on
  purpose. GoTrue renders this through Go's template engine, and text/template
  substitutes actions inside HTML comments just like anywhere else — writing
  the URL variable here as a real action would put a live magic link into every
  delivered email. Invisible to the reader, but inbox providers prefetch links,
  and prefetching consumes the token, which invalidates the code too. That is
  the precise failure this template exists to prevent, so don't reintroduce it
  in a comment.

  Inline styles and a table layout on purpose — email clients strip <style>.
-->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="
    background: #faf8f5;
    padding: 32px 16px;
    font-family:
      -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
      sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="
          max-width: 420px;
          background: #ffffff;
          border: 1px solid #eae4dc;
          border-radius: 16px;
          padding: 32px;
        "
      >
        <tr>
          <td>
            <p
              style="
                margin: 0;
                font-size: 11px;
                font-weight: 800;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #f0603a;
              "
            >
              Destiny
            </p>
            <h1
              style="
                margin: 8px 0 0;
                font-size: 22px;
                font-weight: 800;
                color: #17150f;
              "
            >
              Your login code
            </h1>
            <p
              style="
                margin: 8px 0 0;
                font-size: 14px;
                line-height: 1.5;
                color: #6b6459;
              "
            >
              Enter this code on the login screen to continue. It expires in an
              hour and works once.
            </p>

            <p
              style="
                margin: 24px 0;
                padding: 18px;
                background: #faf8f5;
                border: 1px solid #eae4dc;
                border-radius: 12px;
                text-align: center;
                font-family:
                  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 32px;
                font-weight: 700;
                letter-spacing: 0.18em;
                color: #17150f;
              "
            >
              {{ .Token }}
            </p>

            <p
              style="
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                color: #6b6459;
              "
            >
              Didn't ask for this? Someone probably mistyped their roll number —
              you can ignore this email, and nothing will happen to your
              account.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin: 20px 0 0; font-size: 11px; color: #9a9287">
        Destiny · NIT Warangal campus
      </p>
    </td>
  </tr>
</table>
